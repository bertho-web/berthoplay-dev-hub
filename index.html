<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <!-- Zoom autorisé : le bloquer casse l'accessibilité (WCAG 1.4.4). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />

  <title>BerthoPlay — Console Web Haute Performance</title>
  <meta name="description" content="BerthoPlay est la console Web PWA de nouvelle génération. Jeux 3D instantanés, tchat en direct, appels WebRTC, vocaux et classements en temps réel." />

  <!-- Cartes de partage -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BerthoPlay" />
  <meta property="og:title" content="BerthoPlay — Console Web Haute Performance" />
  <meta property="og:description" content="Rejoignez la console PWA de nouvelle génération. Jeux 3D légers, tchat en direct, appels WebRTC, vocaux et classements en temps réel." />
  <meta property="og:image" content="/pwa-512x512.png" />
  <meta property="og:url" content="https://berthoplay.pages.dev" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="BerthoPlay — Console Web Haute Performance" />
  <meta name="twitter:description" content="Jeux PWA instantanés, réseau social de gamers, causerie vocale et compétition en direct." />
  <meta name="twitter:image" content="/pwa-512x512.png" />

  <!-- Icônes & manifeste. Vite sert public/ à la racine : pas de préfixe /public. -->
  <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <!-- Le manifeste est généré par vite-plugin-pwa depuis vite.config.js :
       il est injecté au build. Une seconde balise ici créerait deux
       manifestes concurrents et le navigateur ne lirait que le premier. -->

  <!-- Thème système -->
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0A0810" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BerthoPlay" />

  <!-- Fontes critiques : préchargées pour éviter le saut de rendu du titre -->
  <link rel="preload" href="/fonts/cinzel-900.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/chakra-petch-500.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Moteur 3D des jeux -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <!-- Design system unique : toutes les vues consomment ces jetons -->
  <link rel="stylesheet" href="/src/styles/index.css" />
</head>

<body>

  <!-- ======================================================================
       AMBIANCE — vidéo de fond, voile et grain. Purement décorative.
       ====================================================================== -->
  <div id="ambience" data-state="still" aria-hidden="true"></div>

  <!-- ======================================================================
       ÉCRAN D'ENTRÉE
       ====================================================================== -->
  <div id="intro-splash" role="status" aria-label="Démarrage de BerthoPlay">
    <svg class="splash-mark" viewBox="0 0 512 512" aria-hidden="true">
      <defs>
        <filter id="markGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="9" result="b" />
          <feComposite in="SourceGraphic" in2="b" operator="over" />
        </filter>
      </defs>

      <!-- Halo de braise -->
      <circle class="mark-halo" cx="256" cy="256" r="152" fill="#C1121F" opacity="0.14" filter="url(#markGlow)" />

      <!-- Écu hexagonal : la silhouette historique de la marque, en pierre -->
      <path class="mark-draw"
            d="M 256 88 L 400 172 L 400 340 L 256 424 L 112 340 L 112 172 Z"
            fill="#14101C" stroke="#EDE7DC" stroke-width="5" stroke-linejoin="round" opacity="0.9" />

      <!-- Arc gothique intérieur -->
      <path class="mark-draw mark-draw--2"
            d="M 168 320 V 232 a 88 88 0 0 1 176 0 V 320"
            fill="none" stroke="#6D28D9" stroke-width="8" stroke-linecap="round" opacity="0.75" />

      <!-- Triangle de lecture -->
      <path class="mark-draw mark-draw--3"
            d="M 224 200 L 320 256 L 224 312 Z"
            fill="#C1121F" stroke="#F2596B" stroke-width="7" stroke-linejoin="round" filter="url(#markGlow)" />

      <!-- Clef de voûte -->
      <circle class="mark-draw mark-draw--4" cx="256" cy="148" r="9" fill="#C9A227" />
    </svg>

    <div class="splash-title">
      <span class="wordmark wordmark--xl">
        <span class="wordmark__a">Bertho</span><span class="wordmark__b">Play</span>
      </span>
      <p class="brand-tagline">Console Web Haute Performance</p>
    </div>
  </div>

  <!-- ======================================================================
       RETOUR AU HUB — visible uniquement pendant un jeu
       ====================================================================== -->
  <button id="btn-back-hub" type="button" data-sfx="back" aria-label="Quitter le jeu et revenir au hub BerthoPlay">
    <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H4"/><path d="m10 6-6 6 6 6"/></svg>
    <span>Hub</span>
  </button>

  <!-- ======================================================================
       COQUE APPLICATIVE
       ====================================================================== -->
  <div id="app-shell">

    <header id="app-header">
      <a class="wordmark wordmark--md" href="#" id="header-brand" data-sfx="nav" aria-label="Accueil BerthoPlay">
        <span class="wordmark__a">Bertho</span><span class="wordmark__b">Play</span>
      </a>

      <div class="row" style="gap: var(--sp-2);">
        <output class="purse" id="purse" aria-live="polite" aria-label="Solde de Berthocoins">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.2A3 3 0 0 0 12 8c-1.7 0-3 1-3 2.2 0 2.8 6 1.2 6 4 0 1.2-1.3 2.2-3 2.2a3 3 0 0 1-2.5-1.2"/><path d="M12 6v12"/></svg>
          <span id="purse-value">0</span>
        </output>

        <button class="btn btn--icon btn--ghost" id="btn-open-eco" type="button" data-sfx="open" aria-label="Ouvrir les infrastructures Bertho">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        </button>
      </div>
    </header>

    <main id="app-main" class="scroll-y">
      <div id="main-tab-container" class="container"></div>
    </main>
  </div>

  <!-- ======================================================================
       NAVIGATION — barre basse sur téléphone, rail latéral dès 1024px
       ====================================================================== -->
  <nav id="bottom-nav" aria-label="Navigation principale">
    <div id="rail-brand">
      <span class="wordmark wordmark--md">
        <span class="wordmark__a">Bertho</span><span class="wordmark__b">Play</span>
      </span>
    </div>

    <button class="nav-item" type="button" data-tab="home" data-sfx="nav" aria-current="page">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-7v6h-4A1.5 1.5 0 0 1 3 20z"/></svg>
      <span>Accueil</span>
    </button>

    <button class="nav-item" type="button" data-tab="feed" data-sfx="nav">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8.5a6 6 0 0 0-12 0c0 6.5-2.5 8.5-2.5 8.5h17S18 15 18 8.5"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span>Actus</span>
      <i class="nav-item__dot" id="badge-feed-notif" aria-hidden="true"></i>
    </button>

    <button class="nav-item" type="button" data-tab="stats" data-sfx="nav">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v6a6 6 0 0 1-12 0z"/><path d="M6 6H4.2A2.2 2.2 0 0 0 4.2 10.5H6"/><path d="M18 6h1.8a2.2 2.2 0 0 1 0 4.5H18"/><path d="M12 16v3"/><path d="M8.5 21h7"/></svg>
      <span>Top</span>
    </button>

    <button class="nav-item" type="button" data-tab="account" data-sfx="nav">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M20 21v-1.5a5 5 0 0 0-5-5H9a5 5 0 0 0-5 5V21"/></svg>
      <span>Compte</span>
      <i class="nav-item__dot" id="badge-account-notif" aria-hidden="true"></i>
    </button>

    <button class="nav-item" type="button" data-tab="settings" data-sfx="nav">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.1 14.5a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.2a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.2a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.2a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.2a1.6 1.6 0 0 0-1.5 1z"/></svg>
      <span>Réglages</span>
    </button>
  </nav>

  <!-- ======================================================================
       FEUILLE D'INSTALLATION PWA
       ====================================================================== -->
  <div class="scrim" id="pwa-scrim" data-dismiss="pwa"></div>

  <div class="sheet" id="pwa-sheet" role="dialog" aria-modal="true" aria-labelledby="pwa-sheet-title" aria-hidden="true">
    <div class="sheet__grip" aria-hidden="true"></div>

    <div class="sheet__head">
      <div class="row" style="gap: var(--sp-3);">
        <img src="/pwa-192x192.png" alt="" class="avatar" width="44" height="44" />
        <div>
          <h2 class="t-screen-title" id="pwa-sheet-title" style="font-size: var(--text-md);">Installer la console</h2>
          <p class="t-meta">BerthoPlay sur votre écran d'accueil</p>
        </div>
      </div>
      <button class="btn btn--icon btn--ghost" id="btn-close-pwa-sheet" type="button" data-sfx="close" aria-label="Fermer">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <div class="sheet__body">
      <ol class="list" id="pwa-steps" style="list-style: none; gap: var(--sp-2); display: flex; flex-direction: column;"></ol>
    </div>

    <div class="sheet__foot">
      <button class="btn btn--primary btn--cut btn--block" id="btn-confirm-pwa" type="button">J'ai compris</button>
    </div>
  </div>

  <!-- ======================================================================
       TOASTS & CANVAS DE JEU
       ====================================================================== -->
  <div class="toast-stack" id="toast-stack" role="status" aria-live="polite"></div>

  <canvas id="canvas-webgl" aria-label="Zone de jeu 3D"></canvas>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
