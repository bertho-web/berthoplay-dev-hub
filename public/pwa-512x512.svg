<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dégradé Néon Principal : Cyan vers Magenta -->
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#7f00ff" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>

    <!-- Dégradé Secondaire pour le relief -->
    <linearGradient id="deepFrame" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0c1d" />
      <stop offset="100%" stop-color="#030308" />
    </linearGradient>

    <!-- Filtre Glow Net et Puissant -->
    <filter id="cleanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fond de l'icône (Squircle mobile sombre) -->
  <rect width="512" height="512" rx="120" fill="#030308" />

  <!-- Lueur de fond diffuse -->
  <circle cx="256" cy="256" r="150" fill="#00f2fe" opacity="0.08" filter="url(#cleanGlow)" />

  <!-- Cadre géométrique extérieur (Hexagone technologique) -->
  <path d="M 256 90 L 398 172 L 398 340 L 256 422 L 114 340 L 114 172 Z" 
        fill="url(#deepFrame)" 
        stroke="url(#cyberNeon)" 
        stroke-width="5" 
        stroke-linejoin="round" />

  <!-- Symbole abstrait : Le Portail / Triangle de vitesse imbriqué (Style WebGL / Next-Gen Gaming) -->
  <g filter="url(#cleanGlow)" fill="none" stroke="url(#cyberNeon)" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Triangle externe dynamique -->
    <path d="M 256 150 L 340 298 H 172 Z" stroke-width="24" opacity="0.4" />
    
    <!-- Triangle central inversé / flèche de progression -->
    <path d="M 256 355 L 180 215 H 332 Z" stroke-width="26" />

    <!-- Lignes de focalisation / énergie aux angles -->
    <path d="M 256 195 V 275" stroke-width="20" stroke-dasharray="8 8" />
  </g>

</svg>
